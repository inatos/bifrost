server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    types {
        application/wasm wasm;
    }

    location ~* \.(wasm|js|css|png|ogg|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
