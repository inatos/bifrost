server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default mime.types must be included — a lone `types { wasm }` block otherwise
    # leaves .js as application/octet-stream and browsers prompt to save ES modules.
    include /etc/nginx/mime.types;

    types {
        application/wasm wasm;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # shell.js is not content-hashed — never mark it immutable.
    location = /shell.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trunk content-hashed assets (…-<hex>.ext). Avoid `{N}` in the regex —
    # nginx Docker entrypoint runs envsubst and treats `{16}` as a variable.
    location ~* -[a-f0-9]+\.(wasm|js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|ogg|ttf)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
