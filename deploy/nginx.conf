server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default mime.types must be included — a lone `types { wasm }` block otherwise
    # leaves .js as application/octet-stream and browsers prompt to save ES modules.
    include /etc/nginx/mime.types;

    types {
        application/wasm wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(wasm|js|css|png|ogg|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
