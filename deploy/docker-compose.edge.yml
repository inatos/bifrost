# Edge mode: Bifrost behind Arathyll's single Caddy (shared network arathyll_edge).
#
# On the shared Arathyll VPS, set in deploy/.env (see .env.example):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.edge.yml
# so plain `docker compose up -d` always attaches web as bifrost_web.
# Without that, Caddy returns 502: lookup bifrost_web failed.
#
# Manual equivalent:
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d --build
#   ./verify-edge.sh
#
# Do NOT enable profile bifrost-own-caddy on a box that already binds :80/:443.

services:
  caddy:
    # Disabled unless explicitly: --profile bifrost-own-caddy
    profiles: ["bifrost-own-caddy"]

  signal:
    networks:
      default: {}
      arathyll_edge:
        aliases:
          - bifrost_signal

  web:
    networks:
      default: {}
      arathyll_edge:
        aliases:
          - bifrost_web

networks:
  arathyll_edge:
    external: true
    name: arathyll_edge
