# Bifrost production stack.

# Required in deploy/.env (see .env.example):
#   BIFROST_HOST, PUBLIC_ORIGIN, PUBLIC_WS_ORIGIN, ACME_EMAIL
# For cross-NAT / lab-iframe play (required for Ready Up across homes):
#   TURN_SECRET, TURN_URLS, EXTERNAL_IP
#   then: docker compose --profile turn -f docker-compose.yml -f docker-compose.edge.yml up -d

services:
  signal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.signal
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0
      PORT: 8787
      MATCHBOX_PORT: 3536
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
      PUBLIC_WS_ORIGIN: ${PUBLIC_WS_ORIGIN:?set PUBLIC_WS_ORIGIN in deploy/.env}
      ROOM_TTL_SECS: 900
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_TTL_SECS: 600
      RUST_LOG: bifrost_signal=info,tower_http=info
    expose:
      - "8787"
      - "3536"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Coturn REST relay (use-auth-secret). Host networking so relay ports map cleanly.
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in deploy/.env}
      - --realm=${BIFROST_HOST:-bifrost.arathyll.com}
      - --server-name=${BIFROST_HOST:-bifrost.arathyll.com}
      - --external-ip=${EXTERNAL_IP:?set EXTERNAL_IP (public IPv4) in deploy/.env}
      - --listening-ip=0.0.0.0
      - --no-multicast-peers
      - --no-cli
      - --no-tls
      - --no-dtls
      # Allow RFC1918 peer permissions so same-LAN / hairpin TURN CREATE_PERMISSION works.
      - --allowed-peer-ip=10.0.0.0-10.255.255.255
      - --allowed-peer-ip=172.16.0.0-172.31.255.255
      - --allowed-peer-ip=192.168.0.0-192.168.255.255
      - --allowed-peer-ip=100.64.0.0-100.127.255.255
      - --verbose

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      signal:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BIFROST_HOST: ${BIFROST_HOST:?set BIFROST_HOST in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - signal

volumes:
  caddy_data:
  caddy_config:
