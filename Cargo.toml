[workspace]
resolver = "2"
members = [
    "crates/bifrost_protocol",
    "crates/bifrost_sim",
    "crates/bifrost_net",
    "crates/bifrost_client",
    "services/bifrost_signal",
]
default-members = ["crates/bifrost_client", "services/bifrost_signal"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/inatos/bifrost"
rust-version = "1.90"

[workspace.dependencies]
bevy = { version = "0.18.1", default-features = false }
bevy_ggrs = { version = "0.20.0", features = ["wasm-bindgen"] }
bevy_matchbox = { version = "0.14.0", features = ["ggrs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
rand = { version = "0.9", default-features = false, features = ["std", "small_rng", "thread_rng"] }
rand_xoshiro = "0.7"
axum = { version = "0.8", features = ["json", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tokio = { version = "1.43", features = ["full"] }
futures-util = "0.3.31"
dashmap = "6.1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"

[profile.dev.package."*"]
opt-level = 2
